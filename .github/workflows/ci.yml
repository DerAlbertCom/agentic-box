name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sbox:
    name: sbox (Bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sbox-cli
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches bun in the mise tools of the workload and the image of kits/sbox/build.
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  abox:
    name: abox (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet csharpier check abox-cli
      - run: dotnet build abox-cli/agentic-box.slnx
      # The xUnit v3 executables run the suites; see docs/verification/synthetic-cli-tests.md.
      - run: dotnet abox-cli/test/Abox.Core.Tests/bin/Debug/net10.0/Abox.Core.Tests.dll -noColor
      - run: dotnet abox-cli/test/Abox.Infrastructure.Tests/bin/Debug/net10.0/Abox.Infrastructure.Tests.dll -noColor
      - run: dotnet abox-cli/test/Abox.IntegrationTests/bin/Debug/net10.0/Abox.IntegrationTests.dll -noColor
      - run: dotnet abox-cli/test/Abox.Tests/bin/Debug/net10.0/Abox.Tests.dll -noColor
