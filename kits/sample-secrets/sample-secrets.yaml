# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Sample dummy secrets
description: >
  Asks for dummy services so abox secrets can be tried without real credentials.
  Every value is a dummy and is injected only for hosts under example.invalid,
  which never resolve.
version: "1.0.0"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - token.sample.example.invalid
          - basic.sample.example.invalid
          - optional.sample.example.invalid
          - custom.sample.example.invalid
          - api.command.sample.example.invalid
          - uploads.command.sample.example.invalid

  # A single value.
  - type: com.docker.sandbox/credential@1
    description: A dummy token
    config:
      service: abox-sample-token
      phase: runtime
      apiKey:
        name: SAMPLE_TOKEN
        proxyManaged: true
        inject:
          - domain: token.sample.example.invalid
            header: Authorization
            format: "Bearer %s"

  # A value built from a username and a password, joined and base64-encoded.
  - type: com.docker.sandbox/credential@1
    description: A dummy Basic login
    config:
      service: abox-sample-basic
      phase: runtime
      apiKey:
        name: SAMPLE_BASIC
        proxyManaged: true
        inject:
          - domain: basic.sample.example.invalid
            header: Authorization
            format: "Basic %s"

  # A value the sandbox starts without.
  - type: com.docker.sandbox/credential@1
    optional: true
    description: An optional dummy key
    config:
      service: abox-sample-optional
      phase: runtime
      apiKey:
        name: SAMPLE_OPTIONAL_KEY
        proxyManaged: true
        inject:
          - domain: optional.sample.example.invalid
            header: X-Api-Key
            format: "%s"
