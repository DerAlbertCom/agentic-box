# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: GitHub Enterprise Cloud authentication
description: >
  gh and git reach the GitHub Enterprise Cloud tenant rwe.ghe.com with the fine-grained
  personal access token of the abox-github-enterprise service (placeholder GHE_TOKEN).
  OpenCode, pi, Claude and the Copilot CLI reach the tenant's Copilot endpoint with the
  gh OAuth token of the abox-github-copilot service (placeholder GHE_COPILOT_TOKEN),
  which the proxy sends to copilot-api.rwe.ghe.com only. Both tokens stay on the host.
  Public GitHub stays anonymous.
version: "4.0.0"
requires: [mti-ca-agents]
args:
  GHE_HOST:
    default: rwe.ghe.com
    enum: [rwe.ghe.com]
    env: GH_HOST
  GHE_PUBLIC_GH_TOKEN:
    default: ""
    enum: [""]
    env: GH_TOKEN
  GHE_PUBLIC_GITHUB_TOKEN:
    default: ""
    enum: [""]
    env: GITHUB_TOKEN
  GHE_OPENCODE_CONFIG:
    default: /home/agent/.config/opencode/team.json
    env: OPENCODE_CONFIG
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: [rwe.ghe.com, api.rwe.ghe.com, uploads.rwe.ghe.com, copilot-api.rwe.ghe.com]
      runtime:
        allow: [rwe.ghe.com, api.rwe.ghe.com, uploads.rwe.ghe.com, copilot-api.rwe.ghe.com, "*.githubcopilot.com"]
  - type: com.docker.sandbox/credential@1
    description: Fine-grained personal access token of GitHub Enterprise (rwe.ghe.com) for gh and git
    config:
      service: abox-github-enterprise
      phase: [install, runtime]
      apiKey:
        name: GHE_TOKEN
        proxyManaged: true
        inject:
          - domain: rwe.ghe.com
            header: Authorization
            format: Bearer %s
          - domain: api.rwe.ghe.com
            header: Authorization
            format: Bearer %s
          - domain: uploads.rwe.ghe.com
            header: Authorization
            format: Bearer %s
  # Copilot rejects personal access tokens, so its endpoint gets a gh OAuth token. The
  # proxy sends it nowhere else: its broad repo scope never reaches the tenant's API.
  - type: com.docker.sandbox/credential@1
    description: GitHub Copilot token of rwe.ghe.com for the agents, the gh OAuth token of this machine
    config:
      service: abox-github-copilot
      phase: [runtime]
      apiKey:
        name: GHE_COPILOT_TOKEN
        proxyManaged: true
        inject:
          - domain: copilot-api.rwe.ghe.com
            header: Authorization
            format: Bearer %s
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -eu
            test -z "${GH_TOKEN:-}" && test -z "${GITHUB_TOKEN:-}"
            if [ -n "${GHE_TOKEN:-}" ]; then
              # A real login, not only an oauth_token entry: the Copilot CLI looks up the
              # account gh names. Only the placeholder is stored.
              printf '%s' "$GHE_TOKEN" |
                gh auth login --hostname "$GH_HOST" --with-token --insecure-storage --git-protocol https ||
                gh config set --host "$GH_HOST" oauth_token "$GHE_TOKEN"
              gh auth setup-git --hostname "$GH_HOST"
            else
              echo "Warning: GHE_TOKEN is empty, so gh and git are not signed in to $GH_HOST. Store the abox-github-enterprise service (docs/github-enterprise-token.md) and recreate the sandbox." >&2
            fi
            # Interactive shells that are not login shells read it too.
            profile=/etc/profile.d/github-enterprise-auth.sh
            grep -qs "$profile" "$HOME/.bashrc" || echo ". $profile" >> "$HOME/.bashrc"
            templates=/opt/github-enterprise-auth/templates
            render() {
              mkdir -p "$(dirname "$2")"
              sed "s/__GHE_HOST__/$GH_HOST/g" "$templates/$1" > "$2"
            }
            render claude/settings.json "$HOME/.claude/settings.json"
            render opencode/team.json "$HOME/.config/opencode/team.json"
            render pi/auth.json "$HOME/.pi/agent/auth.json"
            render pi/models.json "$HOME/.pi/agent/models.json"
          user: "1000"
          env: [GHE_TOKEN, GH_TOKEN, GITHUB_TOKEN, GH_HOST]
  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        GitHub is the GitHub Enterprise Cloud tenant rwe.ghe.com (GH_HOST). gh and git are
        signed in to it with a fine-grained token (proxy-managed GHE_TOKEN placeholder): clone, pull,
        push, branches, tags, pull requests, issues, discussions, organization projects,
        workflow dispatch and runs, workflow files and commit statuses. It has no
        administration permission: creating or deleting repositories fails with 403. There
        is no write access to repository wikis. Public GitHub (github.com) is anonymous.
        OpenCode, pi and Claude use the tenant's Copilot endpoint with a separate token
        (GHE_COPILOT_TOKEN placeholder) that works only there; Claude uses Copilot's native Anthropic endpoint: do not run /login. Claude models
        are claude-opus-5-5, claude-sonnet-5-5 and claude-haiku-4-5; WebSearch is
        unavailable. The standalone Copilot CLI reads COPILOT_GITHUB_TOKEN and GH_HOST from
        the shell.
